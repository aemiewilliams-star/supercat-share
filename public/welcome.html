<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>환영합니다 · supercat 공유</title>
<meta name="description" content="이 페이지는 supercat 공유 포털의 샘플입니다. public/ 에 HTML을 넣고 push 하면 URL로 공유됩니다.">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: ui-sans-serif, system-ui, "Apple SD Gothic Neo", sans-serif;
    background: #0b0b0e; color: #f4f4f5; line-height: 1.6; }
  .box { max-width: 560px; padding: 40px; }
  h1 { font-size: 26px; margin: 0 0 12px; letter-spacing: -0.02em; }
  p { color: #a1a1aa; }
  code { font-family: ui-monospace, Menlo, monospace; background: #1c1c22;
    padding: 2px 7px; border-radius: 6px; color: #e4e4e7; }
  ol { color: #a1a1aa; padding-left: 20px; }
  li { margin: 6px 0; }
  a { color: #818cf8; }
</style>
</head>
<body>
  <div class="box">
    <h1>supercat 공유 포털 👋</h1>
    <p>이 페이지는 샘플이에요. 새 자료를 공유하는 방법:</p>
    <ol>
      <li><code>public/</code> 폴더에 만든 HTML 파일을 넣기 (예: <code>report.html</code>)</li>
      <li><code>git push</code></li>
      <li>잠시 뒤 <code>/report</code> 주소로 공유 — 메인 페이지(<a href="./">목록</a>)에도 자동 등록</li>
    </ol>
    <p>이 샘플 파일은 지워도 됩니다.</p>
  </div>
</body>
</html>
